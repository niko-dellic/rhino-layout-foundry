name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props
      - name: Restore
        run: dotnet restore RhinoLayoutFoundry.sln
      - name: Build
        run: dotnet build RhinoLayoutFoundry.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test RhinoLayoutFoundry.sln --configuration Release --no-build --logger trx

